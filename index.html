<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Samuel James Garcia</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #07050a;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(217, 4, 41, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(114, 9, 183, 0.16) 0%, transparent 45%);
      color: #f8f9fa;
      font-family: 'VT323', monospace;
      overflow-x: hidden;
    }

    .font-pixel-title {
      font-family: 'Press Start 2P', monospace;
      line-height: 1.4;
    }

    .pixel-box {
      background: #130e1c;
      border: 4px solid #ffb703;
      box-shadow:
        0 0 0 4px #050308,
        inset 0 0 0 4px #3c1642,
        0 8px 0 0 #050308;
    }

    .pixel-box-pink {
      background: #190d22;
      border: 4px solid #d90429;
      box-shadow:
        0 0 0 4px #050308,
        inset 0 0 0 4px #4a154b,
        0 8px 0 0 #050308;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1.4;
      padding: 10px 12px;
      border: 3px solid #050308;
      box-shadow:
        inset -3px -3px 0px rgba(0, 0, 0, 0.45),
        inset 3px 3px 0px rgba(255, 255, 255, 0.25),
        0 4px 0 #050308;
      transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.12s ease;
      cursor: pointer;
      text-transform: uppercase;
    }

    .pixel-btn:hover:not(:disabled) {
      filter: brightness(1.12);
    }

    .pixel-btn:active:not(:disabled),
    .pixel-btn.active-press {
      transform: translateY(4px);
      box-shadow:
        inset -2px -2px 0px rgba(0, 0, 0, 0.45),
        inset 2px 2px 0px rgba(255, 255, 255, 0.2),
        0 0px 0 #050308;
    }

    .pixel-input {
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #0a0710;
      border: 3px solid #6c2bd9;
      color: #fff8e7;
      padding: 6px 10px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .pixel-input:focus {
      border-color: #ffb703;
    }

    #pixelCanvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: none;
    }

    .eq-bar {
      width: 6px;
      background: #ffb703;
      transition: height 0.08s steps(3);
    }

    .scanlines {
      background:
        radial-gradient(circle at center, transparent 58%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0, 0, 0, 0.28) 50%,
          rgba(0, 0, 0, 0.28)
        );
      background-size: 100% 100%, 100% 4px;
      pointer-events: none;
    }

    .fazbear-checker {
      height: 10px;
      background-image:
        linear-gradient(45deg, #000 25%, transparent 25%),
        linear-gradient(-45deg, #000 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #000 75%),
        linear-gradient(-45deg, transparent 75%, #000 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0;
      background-color: #ffffff;
      border-top: 2px solid #d90429;
      border-bottom: 2px solid #d90429;
    }

    @keyframes recBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }
    .rec-dot {
      animation: recBlink 1s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center p-2 sm:p-4">

  <!-- Compact Header with Live Philippines Clock -->

          <h1 id="headerTitle" class="font-pixel-title text-xs sm:text-sm text-[#ffb703]">
            HAPPY BIRTHDAY, SAM!

        <div class="flex flex-wrap items-center gap-2">

            <span class="text-[#38b000]">PH:</span>

          </div>

  <!-- Clean Visual Stage -->
  <main class="max-w-4xl w-full mx-auto flex flex-col gap-3">

        <!-- Top-Right Live Cam Overlay on Canvas -->

        <!-- Segmented Pixel Blow Bar -->

          ✓ APPLY
        </button>

    </section>
  </main>

  <script>

      const CANDLE_COLORS = [
        { body: '#d90429', stripe: '#ffffff' },

      const state = {
        recipientName: 'Sam',
        flavorKey: 'fazbear',
        candleCount: 5,
        candles: [],
        allExtinguished: false,
        blowPower: 0,
        isHoldingBlow: false,
        micActive: false,
        soundMuted: false,
        musicPlaying: false,
        musicStyle: 'toreador',
        tick: 0,
        noseHonkFlash: 0,
        pointerDown: false,
        stars: [],
        balloons: [],
        smokeParticles: [],
        confettiParticles: [],
        floatingNotes: []
      };

      // ==========================================
      // 2. DOM ELEMENTS
      // ==========================================
      const canvas = document.getElementById('pixelCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const headerTitle = document.getElementById('headerTitle');
      const phLiveClock = document.getElementById('phLiveClock');
      const canvasClockOverlay = document.getElementById('canvasClockOverlay');
      const candleCounterText = document.getElementById('candleCounterText');
      const btnCustomizeToggle = document.getElementById('btnCustomizeToggle');
      const btnMuteToggle = document.getElementById('btnMuteToggle');
      const celebrationBanner = document.getElementById('celebrationBanner');
      const celebrationHeading = document.getElementById('celebrationHeading');
      const celebrationSubtext = document.getElementById('celebrationSubtext');
      const windBarFill = document.getElementById('windBarFill');
      const btnHoldBlow = document.getElementById('btnHoldBlow');
      const btnMicToggle = document.getElementById('btnMicToggle');
      const micBtnText = document.getElementById('micBtnText');
      const btnRelight = document.getElementById('btnRelight');

      const eqBars = Array.from(document.querySelectorAll('#eqContainer .eq-bar'));
      const selectMusicStyle = document.getElementById('selectMusicStyle');
      const btnPlayPauseMusic = document.getElementById('btnPlayPauseMusic');
      const btnPartyHorn = document.getElementById('btnPartyHorn');

      const customizerPanel = document.getElementById('customizerPanel');
      const btnCloseCustomizer = document.getElementById('btnCloseCustomizer');
      const inputRecipient = document.getElementById('inputRecipient');
      const selectCandleCount = document.getElementById('selectCandleCount');
      const selectCakeFlavor = document.getElementById('selectCakeFlavor');
      const btnApplyCustomization = document.getElementById('btnApplyCustomization');

      // ==========================================
      // 3. LIVE PHILIPPINES CLOCK (Asia/Manila)
      // ==========================================
      function getPhilippinesTimeString() {
        try {
          return new Intl.DateTimeFormat('en-PH', {
            timeZone: 'Asia/Manila',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          }).format(new Date());
        } catch (e) {
          const now = new Date();
          const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
          const phDate = new Date(utcMs + 8 * 3600000);
          return phDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }
      }

      function updatePhilippinesClock() {
        const timeStr = getPhilippinesTimeString();
        phLiveClock.textContent = timeStr;
        canvasClockOverlay.textContent = timeStr;
      }

      setInterval(updatePhilippinesClock, 1000);
      updatePhilippinesClock();

      // ==========================================
      // 4. WEB AUDIO API 8-BIT SYNTHESIZER & MIC
      // ==========================================
      let audioCtx = null;
      let melodyTimer = null;
      let currentStepIndex = 0;

      let micStream = null;
      let micAnalyser = null;
      let micDataArray = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      const NOTE_FREQ = {
        'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'Ab3': 207.65, 'A3': 220.00, 'Bb3': 233.08, 'B3': 246.94,
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'Ab4': 415.30, 'A4': 440.00, 'Bb4': 466.16, 'B4': 493.88,
        'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00
      };

      const TOREADOR_AND_BIRTHDAY_SCORE = [
        { note: 'C5', bass: 'F3', chord: ['F4', 'A4', 'C5'], dur: 2.5 },
        { note: 'D5', bass: 'F3', chord: ['F4', 'Bb4', 'D5'], dur: 0.5 },
        { note: 'C5', bass: 'F3', chord: ['F4', 'A4', 'C5'], dur: 1.5 },
        { note: 'A4', bass: 'F3', chord: ['F4', 'A4', 'C5'], dur: 1.5 },
        { note: 'A4', bass: 'C3', chord: ['E4', 'G4', 'C5'], dur: 1.5 },
        { note: 'G4', bass: 'C3', chord: ['E4', 'G4', 'Bb4'], dur: 0.5 },
        { note: 'F#4', bass: 'D3', chord: ['D4', 'F#4', 'A4'], dur: 0.5 },
        { note: 'G4', bass: 'G3', chord: ['D4', 'G4', 'Bb4'], dur: 0.5 },
        { note: 'A4', bass: 'C3', chord: ['F4', 'A4', 'C5'], dur: 3.0 },

        { note: 'C4', bass: 'C3', chord: ['C4', 'E4', 'G4'], dur: 1.5 },
        { note: 'C4', bass: 'C3', chord: ['C4', 'E4', 'G4'], dur: 0.5 },
        { note: 'D4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 2 },
        { note: 'C4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 2 },
        { note: 'F4', bass: 'F3', chord: ['A3', 'C4', 'F4'], dur: 2 },
        { note: 'E4', bass: 'C3', chord: ['G3', 'C4', 'E4'], dur: 4 },

        { note: 'C4', bass: 'C3', chord: ['C4', 'E4', 'G4'], dur: 1.5 },
        { note: 'C4', bass: 'C3', chord: ['C4', 'E4', 'G4'], dur: 0.5 },
        { note: 'D4', bass: 'C3', chord: ['E3', 'G3', 'C4'], dur: 2 },
        { note: 'C4', bass: 'C3', chord: ['E3', 'G3', 'C4'], dur: 2 },
        { note: 'G4', bass: 'C3', chord: ['G3', 'Bb3', 'E4'], dur: 2 },
        { note: 'F4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 4 },

        { note: 'C4', bass: 'C3', chord: ['C4', 'E4', 'G4'], dur: 1.5 },
        { note: 'C4', bass: 'C3', chord: ['C4', 'E4', 'G4'], dur: 0.5 },
        { note: 'C5', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 2 },
        { note: 'A4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 2 },
        { note: 'F4', bass: 'F3', chord: ['A3', 'C4', 'F4'], dur: 2 },
        { note: 'E4', bass: 'Bb3', chord: ['Bb3', 'D4', 'F4'], dur: 2 },
        { note: 'D4', bass: 'Bb3', chord: ['Bb3', 'D4', 'F4'], dur: 3 },

        { note: 'Bb4', bass: 'Bb3', chord: ['Bb3', 'D4', 'G4'], dur: 1.5 },
        { note: 'Bb4', bass: 'Bb3', chord: ['Bb3', 'D4', 'G4'], dur: 0.5 },
        { note: 'A4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 2 },
        { note: 'F4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 2 },
        { note: 'G4', bass: 'C3', chord: ['G3', 'Bb3', 'E4'], dur: 2 },
        { note: 'F4', bass: 'F3', chord: ['F3', 'A3', 'C4'], dur: 4 }
      ];

      function playChiptuneNote(stepObj) {
        if (state.soundMuted) return;
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const now = ctxAudio.currentTime;
        const style = state.musicStyle;
        const isMusicBox = style === 'musicbox' || style === 'toreador';
        const stepUnitSec = style === 'arcade' ? 0.19 : isMusicBox ? 0.23 : 0.21;
        const noteDurSec = stepObj.dur * stepUnitSec;

        const octaveShift = isMusicBox ? 2 : 1;
        const leadFreq = (NOTE_FREQ[stepObj.note] || 261.63) * octaveShift;
        if (leadFreq) {
          const osc = ctxAudio.createOscillator();
          const gain = ctxAudio.createGain();
          osc.type = isMusicBox ? 'sine' : 'square';
          osc.frequency.setValueAtTime(leadFreq, now);

          if (isMusicBox) {
            const bellOsc = ctxAudio.createOscillator();
            const bellGain = ctxAudio.createGain();
            bellOsc.type = 'triangle';
            bellOsc.frequency.setValueAtTime(leadFreq * 2, now);
            bellGain.gain.setValueAtTime(0.045, now);
            bellGain.gain.exponentialRampToValueAtTime(0.0008, now + Math.min(0.28, noteDurSec * 0.7));
            bellOsc.connect(bellGain);
            bellGain.connect(ctxAudio.destination);
            bellOsc.start(now);
            bellOsc.stop(now + noteDurSec);
          }

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(isMusicBox ? 0.15 : 0.11, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + noteDurSec * 0.95);

          osc.connect(gain);
          gain.connect(ctxAudio.destination);
          osc.start(now);
          osc.stop(now + noteDurSec);
        }

        const bassFreq = (NOTE_FREQ[stepObj.bass] || 130.81) * (isMusicBox ? 2 : 1);
        if (bassFreq) {
          const bassOsc = ctxAudio.createOscillator();
          const bassGain = ctxAudio.createGain();
          bassOsc.type = 'triangle';
          bassOsc.frequency.setValueAtTime(bassFreq, now);

          bassGain.gain.setValueAtTime(0.001, now);
          bassGain.gain.linearRampToValueAtTime(0.09, now + 0.01);
          bassGain.gain.exponentialRampToValueAtTime(0.001, now + noteDurSec * 0.9);

          bassOsc.connect(bassGain);
          bassGain.connect(ctxAudio.destination);
          bassOsc.start(now);
          bassOsc.stop(now + noteDurSec);
        }

        if (!isMusicBox && stepObj.chord && stepObj.chord.length) {
          const arpOsc = ctxAudio.createOscillator();
          const arpGain = ctxAudio.createGain();
          arpOsc.type = style === 'arcade' ? 'sawtooth' : 'square';

          const arpSlices = Math.max(3, Math.floor(noteDurSec / 0.055));
          for (let i = 0; i < arpSlices; i++) {
            const cNote = stepObj.chord[i % stepObj.chord.length];
            const cFreq = NOTE_FREQ[cNote] || 261.63;
            arpOsc.frequency.setValueAtTime(cFreq, now + i * 0.055);
          }

          arpGain.gain.setValueAtTime(0.035, now);
          arpGain.gain.exponentialRampToValueAtTime(0.001, now + noteDurSec * 0.92);

          arpOsc.connect(arpGain);
          arpGain.connect(ctxAudio.destination);
          arpOsc.start(now);
          arpOsc.stop(now + noteDurSec);
        }
      }

      function scheduleNextStep() {
        if (!state.musicPlaying) return;

        const stepObj = TOREADOR_AND_BIRTHDAY_SCORE[currentStepIndex];
        playChiptuneNote(stepObj);

        const style = state.musicStyle;
        const isMusicBox = style === 'musicbox' || style === 'toreador';
        const stepUnitMs = style === 'arcade' ? 190 : isMusicBox ? 230 : 210;

        eqBars.forEach((bar) => {

          bar.style.height = h + 'px';

        spawnFloatingNote();

      // Microphone Input Detection
      async function toggleMicrophone() {
        if (state.micActive) {
          stopMicrophone();
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const ctxAudio = ensureAudioContext();
          const source = ctxAudio.createMediaStreamSource(stream);
          micAnalyser = ctxAudio.createAnalyser();
          micAnalyser.fftSize = 256;
          source.connect(micAnalyser);
          micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
          micStream = stream;
          state.micActive = true;
          micBtnText.textContent = '🎙️ MIC ON';
          btnMicToggle.className = 'pixel-btn bg-[#d90429] text-white py-2.5';
        } catch (err) {
          state.micActive = false;
        }
      }

      function stopMicrophone() {
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        micAnalyser = null;
        state.micActive = false;
        micBtnText.textContent = '🎙️ MIC BLOW';
        btnMicToggle.className = 'pixel-btn bg-[#38b000] text-[#050308] py-2.5';
      }

      function sampleMicVolume() {
        if (!state.micActive || !micAnalyser || !micDataArray) return 0;
        micAnalyser.getByteFrequencyData(micDataArray);
        let sum = 0;
        const bins = 28;
        for (let i = 0; i < bins; i++) {
          sum += micDataArray[i];
        }
        const avg = sum / bins;
        return Math.min(100, Math.max(0, (avg - 22) * 1.45));
      }

          const style = CANDLE_COLORS[i % CANDLE_COLORS.length];

        pxRect(62, 91, 76, 2, flavor.filling);

        pxRect(60, 82, 80, 4, flavor.icing);
        for (let dx = 64; dx <= 132; dx += 8) {
          const dripH = (dx % 16 === 0) ? 4 : 2;
          pxRect(dx, 86, 4, dripH, flavor.icing);
          pxRect(dx, 86 + dripH, 4, 1, flavor.icingShadow);
        }

        for (let cx = 54; cx <= 146; cx += 18) {
          pxRect(cx - 1, 94, 3, 3, flavor.cherry);
          pxRect(cx - 1, 94, 1, 1, '#ffffff');
        }
      }

      function drawCandlesAndFlames() {
        const windLean = state.blowPower > 10 ? Math.min(4, Math.ceil(state.blowPower / 25)) : 0;

        state.candles.forEach(c => {
          const topY = c.y - c.height;

          pxRect(c.x - 2, topY, 4, c.height, c.bodyColor);
          for (let sy = topY + 2; sy < c.y - 1; sy += 4) {
            pxRect(c.x - 2, sy, 2, 2, c.stripeColor);
            pxRect(c.x, sy + 2, 2, 2, c.stripeColor);
          }

          pxRect(c.x - 1, topY - 2, 2, 2, '#111111');

          if (c.lit) {
            const fTick = state.tick + c.flickerOffset;
            const tall = (fTick % 12) < 6 ? 1 : 0;
            const sway = windLean + ((fTick % 8 < 4) ? 0 : 1);

            ctx.fillStyle = 'rgba(255, 183, 3, 0.20)';
            ctx.fillRect(c.x - 5 + windLean, topY - 10, 10, 10);

            pxRect(c.x - 2 + sway, topY - 7 - tall, 4, 5 + tall, '#ff6b35');
            pxRect(c.x - 1 + sway, topY - 9 - tall, 2, 2, '#ff9f1c');
            pxRect(c.x - 1 + sway, topY - 6, 2, 4, '#ffd166');
            pxRect(c.x - 1 + Math.floor(sway / 2), topY - 4, 2, 2, '#ffffff');
          }
        });
      }

      function drawSecurityCamHUD() {
        const c = '#e2e8f0';
        pxRect(4, 4, 10, 1, c);
        pxRect(4, 4, 1, 10, c);
        pxRect(186, 4, 10, 1, c);
        pxRect(195, 4, 1, 10, c);
        pxRect(4, 145, 10, 1, c);
        pxRect(4, 136, 1, 10, c);
        pxRect(186, 145, 10, 1, c);
        pxRect(195, 136, 1, 10, c);

        if (state.tick % 40 < 24) {
          pxRect(8, 8, 4, 4, '#d90429');
        }

        if (state.tick % 17 === 0) {
          const sy = 15 + ((state.tick * 7) % 120);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.fillRect(0, sy, 200, 2);
        }
      }

      function drawParticles() {
        state.smokeParticles.forEach(p => {
          const alpha = Math.max(0.15, p.life / p.maxLife);
          ctx.fillStyle = `rgba(203, 213, 225, ${alpha.toFixed(2)})`;
          const sz = p.life < 18 ? 3 : 2;
          ctx.fillRect(Math.round(p.x), Math.round(p.y), sz, sz);
        });

        state.confettiParticles.forEach(p => {
          pxRect(p.x, p.y, p.size, p.size, p.color);
        });

        state.floatingNotes.forEach(n => {
          const nx = Math.round(n.x + Math.sin(n.phase + state.tick * 0.1) * 3);
          const ny = Math.round(n.y);
          pxRect(nx, ny, 3, 2, n.color);
          pxRect(nx + 2, ny - 4, 1, 5, n.color);
          pxRect(nx + 3, ny - 4, 2, 1, n.color);
        });
      }

      // ==========================================
      // 7. SIMULATION LOOP & INTERACTIONS
      // ==========================================
      function updateSimulation() {
        state.tick++;
        if (state.noseHonkFlash > 0) state.noseHonkFlash--;

        const micLevel = sampleMicVolume();
        if (state.isHoldingBlow) {
          state.blowPower = Math.min(100, state.blowPower + 4.2);
        } else if (micLevel > 8) {
          state.blowPower = micLevel;
        } else {
          state.blowPower = Math.max(0, state.blowPower - 5);
        }

        windBarFill.style.width = `${Math.round(state.blowPower)}%`;

        if (state.blowPower > 20) {
          state.candles.forEach(c => {
            if (c.lit) {
              const drain = (state.blowPower / 26) * (0.8 + Math.random() * 0.6);
              c.hp -= drain;
              if (c.hp <= 0) {
                extinguishCandle(c);
              }
            }
          });
        }

        state.balloons.forEach(b => {
          if (b.popped) {
            b.respawnTimer--;
            if (b.respawnTimer <= 0) {
              b.popped = false;
              b.y = 140;
            }
          } else {
            const targetY = b.baseY + Math.sin((state.tick + b.phase) * 0.05) * 3.5;
            b.y += (targetY - b.y) * 0.1;
          }
        });

        for (let i = state.smokeParticles.length - 1; i >= 0; i--) {
          const p = state.smokeParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          if (p.life <= 0) state.smokeParticles.splice(i, 1);
        }

        if (state.musicPlaying && state.tick % 8 === 0) {
          spawnConfettiBurst(20 + Math.random() * 160, 8, 3);
        }

        for (let i = state.confettiParticles.length - 1; i >= 0; i--) {
          const p = state.confettiParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.045;
          p.vx *= 0.98;
          p.life--;
          if (p.life <= 0 || p.y > 152) {
            state.confettiParticles.splice(i, 1);
          }
        }

        for (let i = state.floatingNotes.length - 1; i >= 0; i--) {
          const n = state.floatingNotes[i];
          n.y += n.vy;
          n.life--;
          if (n.life <= 0) state.floatingNotes.splice(i, 1);
        }
      }

      function renderScene() {
        drawFnafPizzeriaRoom();
        drawAnimatronics();
        drawBalloons();
        drawTableAndCupcake();
        drawPixelCake();
        drawCandlesAndFlames();
        drawParticles();
        drawSecurityCamHUD();
      }

      function loop() {
        updateSimulation();
        renderScene();
        requestAnimationFrame(loop);
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function interactAtPoint(px, py, isClick) {
        ensureAudioContext();

        // Click Freddy's nose to honk!
        if (isClick && Math.hypot(px - 100, py - 45) <= 10) {
          playFreddyHonkSfx();
          spawnConfettiBurst(100, 44, 14);
        }

        // Swipe/click candle flames
        state.candles.forEach(c => {
          if (!c.lit) return;
          const flameX = c.x;
          const flameY = c.y - c.height - 4;
          if (Math.hypot(px - flameX, py - flameY) <= 11) {
            extinguishCandle(c);
          }
        });

        // Pop balloons
        if (isClick) {
          state.balloons.forEach(b => {
            if (b.popped) return;
            if (Math.hypot(px - b.x, py - b.y) <= 9) {
              b.popped = true;
              b.respawnTimer = 150;
              playBalloonPopSfx();
              spawnConfettiBurst(b.x, b.y, 18);
            }
          });
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        state.pointerDown = true;
        const pt = getCanvasCoords(e.clientX, e.clientY);
        interactAtPoint(pt.x, pt.y, true);
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!state.pointerDown) return;
        const pt = getCanvasCoords(e.clientX, e.clientY);
        interactAtPoint(pt.x, pt.y, false);
      });

      window.addEventListener('pointerup', () => {
        state.pointerDown = false;
        state.isHoldingBlow = false;
        btnHoldBlow.classList.remove('active-press');
      });

      btnHoldBlow.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        ensureAudioContext();
        state.isHoldingBlow = true;
        btnHoldBlow.classList.add('active-press');
      });

      window.addEventListener('keydown', (e) => {
        const tag = document.activeElement ? document.activeElement.tagName : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          ensureAudioContext();
          state.isHoldingBlow = true;
          btnHoldBlow.classList.add('active-press');
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          state.isHoldingBlow = false;
          btnHoldBlow.classList.remove('active-press');
        }
      });

      btnRelight.addEventListener('click', () => {
        ensureAudioContext();
        stopBirthdayMusic();
        state.candles.forEach(c => {
          c.lit = true;
          c.hp = 100;
        });
        state.allExtinguished = false;
        celebrationBanner.classList.add('hidden');
        playWishStarSfx();
        updateCandleStatusUI();
      });

      btnMicToggle.addEventListener('click', () => {
        ensureAudioContext();
        toggleMicrophone();
      });

      btnMuteToggle.addEventListener('click', () => {
        state.soundMuted = !state.soundMuted;
        if (state.soundMuted) {
          btnMuteToggle.textContent = '🔇 OFF';
          btnMuteToggle.className = 'pixel-btn bg-[#3d1e5d] text-[#d90429]';
        } else {
          ensureAudioContext();
          btnMuteToggle.textContent = '🔊 ON';
          btnMuteToggle.className = 'pixel-btn bg-[#221a2e] text-[#38b000]';
        }
      });

      btnPlayPauseMusic.addEventListener('click', () => {
        ensureAudioContext();
        if (state.musicPlaying) {
          stopBirthdayMusic();
        } else {
          startBirthdayMusic();
        }
      });

      selectMusicStyle.addEventListener('change', (e) => {
        state.musicStyle = e.target.value;
        if (state.musicPlaying) {
          startBirthdayMusic();
        }
      });

      btnPartyHorn.addEventListener('click', () => {
        ensureAudioContext();
        playPartyHornSfx();
        spawnConfettiBurst(100, 50, 45);
      });

      btnCustomizeToggle.addEventListener('click', () => {
        customizerPanel.classList.toggle('hidden');
      });

      btnCloseCustomizer.addEventListener('click', () => {
        customizerPanel.classList.add('hidden');
      });

      btnApplyCustomization.addEventListener('click', () => {
        ensureAudioContext();
        state.recipientName = inputRecipient.value.trim() || 'Sam';
        state.candleCount = parseInt(selectCandleCount.value, 10) || 5;
        state.flavorKey = selectCakeFlavor.value || 'fazbear';

        stopBirthdayMusic();
        buildCandles();
        playWishStarSfx();
        customizerPanel.classList.add('hidden');
      });

      window.addEventListener('load', () => {
        initStars();
        initBalloons();
        buildCandles();
        loop();
      });
    })();
  </script>
</body>
</html>
